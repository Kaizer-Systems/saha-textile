# Admin SPA container: plain HTTP on the private network; TLS terminates at the edge.
server {
	listen 8080;
	root /usr/share/nginx/html;

	# Runtime config is mounted per environment and must never be cached.
	location = /config.json {
		add_header Cache-Control "no-store";
		try_files $uri =404;
	}

	# Dark mode's stylesheet and the script that links it before the app starts keep their names
	# from release to release (the script must know the file's address), so browsers check them
	# on every visit instead of keeping last year's copy.
	location ~ ^/assets/(css/theme-dark\.gen\.css|js/theme-mode\.js)$ {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	# Hashed build assets are immutable.
	location ~* \.(?:js|css|woff2?|svg|png|jpg|webp|ico)$ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html;
	}
}
