<app-page-wrapper
	[gridClass]="'col-sm-12'"
	[title]="'ship_new_rule_set'"
>
	<div class="theme-form theme-form-2 mega-form">
		<app-form-fields
			[label]="'name'"
			[for]="'ship_new_name'"
			[required]="true"
			[labelClass]="'form-label-title col-sm-3 mb-0'"
			[gridClass]="'col-sm-9'"
		>
			<input
				class="form-control"
				id="ship_new_name"
				maxlength="80"
				[ngModel]="name()"
				(ngModelChange)="name.set($event)"
			/>
		</app-form-fields>
		<app-form-fields
			[label]="'ship_used_for'"
			[labelClass]="'form-label-title col-sm-3 mb-0'"
			[gridClass]="'col-sm-9'"
		>
			<div class="d-flex gap-2">
				@for (choice of uses; track choice) {
				<button
					type="button"
					class="btn btn-sm"
					[class.btn-theme]="use() === choice"
					[class.btn-outline]="use() !== choice"
					[attr.aria-pressed]="use() === choice"
					(click)="use.set(choice)"
				>
					{{ 'ship_use_' + choice | transloco }}
				</button>
				}
			</div>
			<p class="help-text">{{ 'ship_used_for_help' | transloco }}</p>
		</app-form-fields>
	</div>
	<h6 class="mt-2 mb-3">{{ 'ship_start_from' | transloco }}</h6>
	<div
		class="row g-3"
		role="radiogroup"
		[attr.aria-label]="'ship_start_from' | transloco"
	>
		<div class="col-xxl-3 col-lg-4 col-md-6">
			<label class="card mb-0 h-100">
				<div class="card-body">
					<div class="d-flex justify-content-between">
						<i
							class="ri-add-box-line fs-4 text-success"
							aria-hidden="true"
						></i>
						<input
							class="form-check-input"
							type="radio"
							name="ship_start_from"
							id="ship_start_blank"
							[checked]="from() === null"
							(change)="from.set(null)"
						/>
					</div>
					<h6 class="mt-2 mb-1">{{ 'ship_blank' | transloco }}</h6>
					<p class="small text-muted mb-0">{{ 'ship_blank_help' | transloco }}</p>
				</div>
			</label>
		</div>
		@for (premade of premades(); track premade.id) {
		<div class="col-xxl-3 col-lg-4 col-md-6">
			<label class="card mb-0 h-100">
				<div class="card-body">
					<div class="d-flex justify-content-between">
						<i
							[class]="icon(premade.premadeKey) + ' fs-4 text-success'"
							aria-hidden="true"
						></i>
						<input
							class="form-check-input"
							type="radio"
							name="ship_start_from"
							[id]="'ship_start_' + premade.id"
							[checked]="from() === premade.id"
							(change)="from.set(premade.id)"
						/>
					</div>
					<h6 class="mt-2 mb-1">{{ 'ship_premade_' + premade.premadeKey | transloco }}</h6>
					<p class="small text-muted mb-0">
						{{ 'ship_premade_' + premade.premadeKey + '_help' | transloco }}
					</p>
					<span class="badge bg-light text-dark mt-2">{{ 'ship_premade_badge' | transloco }}</span>
				</div>
			</label>
		</div>
		}
	</div>
	<div class="d-flex justify-content-end mt-4 flex-wrap gap-2">
		<a
			class="btn btn-outline"
			[routerLink]="['/shipping/rule-sets']"
		>
			{{ 'cancel' | transloco }}
		</a>
		<button
			type="button"
			class="btn btn-theme"
			id="ship_new_continue"
			[disabled]="!name().trim() || busy()"
			(click)="create()"
		>
			{{ 'ship_continue' | transloco }}
		</button>
	</div>
</app-page-wrapper>
