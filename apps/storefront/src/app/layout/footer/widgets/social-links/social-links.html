@if (profiles().length) {
<div class="social-link">
	<div class="h6 text-content">{{ 'stay_connected' | transloco }}:</div>
	<ul>
		@for (profile of profiles(); track profile.key) {
		<li>
			<a
				[href]="profile.href"
				target="_blank"
				rel="noopener"
				[attr.aria-label]="profile.label"
			>
				<i [class]="profile.icon"></i>
			</a>
		</li>
		}
	</ul>
</div>
}
