<ul>
	@for (link of links(); track link) {
	<li>
		<a
			routerLink="/{{link.link}}"
			class="text-content"
		>
			{{ link.label | titleCase }}
		</a>
	</li>
	} @if (cookieSettings()) {
	<li>
		<a
			href="javascript:void(0)"
			class="text-content"
			id="cookie_settings_link"
			(click)="consent.openSettings()"
		>
			{{ 'cookie_settings' | transloco }}
		</a>
	</li>
	}
</ul>
