<div class="pin-pad">
	<!--
		The entered PIN, shown as filled dots rather than digits. Deliberately not an input:
		nothing here is focusable, so no device keyboard can be summoned for it.

		The dot is always rendered; only its colour changes. An empty cell used to hold no text
		at all, which gave it no line box, so every cell grew the moment the first digit landed.
	-->
	<div
		class="d-flex justify-content-center mb-4 gap-2"
		role="status"
		[attr.aria-label]="'pin_digits_entered' | transloco: { entered: value().length, total: length() }"
	>
		@for (filled of cells(); track $index) {
		<span
			class="form-control pin-pad-cell text-center"
			[class.pin-pad-cell-filled]="filled"
			aria-hidden="true"
		>
			&bull;
		</span>
		}
	</div>

	<div class="row g-2">
		@for (key of keys; track key) {
		<div class="col-4">
			<button
				type="button"
				class="btn btn-outline-secondary pin-pad-key w-100"
				[class.active]="isPressed(key)"
				[attr.aria-disabled]="isComplete() || null"
				(click)="append(key)"
			>
				{{ key }}
			</button>
		</div>
		}

		<div class="col-4">
			<button
				type="button"
				class="btn btn-outline-secondary pin-pad-key pin-pad-key-word w-100"
				[class.active]="isPressed('Escape')"
				[attr.aria-disabled]="!value().length || null"
				[attr.aria-label]="'clear_pin' | transloco"
				(click)="clear()"
			>
				{{ 'clear' | transloco }}
			</button>
		</div>

		<div class="col-4">
			<button
				type="button"
				class="btn btn-outline-secondary pin-pad-key w-100"
				[class.active]="isPressed('0')"
				[attr.aria-disabled]="isComplete() || null"
				(click)="append('0')"
			>
				0
			</button>
		</div>

		<div class="col-4">
			<button
				type="button"
				class="btn btn-outline-secondary pin-pad-key w-100"
				[class.active]="isPressed('Backspace')"
				[attr.aria-disabled]="!value().length || null"
				[attr.aria-label]="'delete_last_digit' | transloco"
				(click)="backspace()"
			>
				<i
					class="ri-delete-back-2-line"
					aria-hidden="true"
				></i>
			</button>
		</div>
	</div>
</div>
