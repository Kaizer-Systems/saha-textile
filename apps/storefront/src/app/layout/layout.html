<!-- Top Progress Loader -->
<ngx-loading-bar
	class="loader-bg"
	[includeSpinner]="true"
	[height]="'3px'"
/>

<!-- Main Loader -->
@if (siteConfigService.preloader()) {
<app-loader />
}

<!-- Layout Partial -->
<app-header />
<!-- The first tag after the header: the page head holds the first paint until it arrives (index.html, rel="expect"). -->
<router-outlet id="page-content" />
<!-- The footer stays awake from the start: its Cookie settings link must work at the first click. -->
<app-footer [footer]="footerData" />

<!-- Widgets: none of them is on the first screen (popups, sticky bars, back to top), so each loads in its own file
     once the page is idle, after the first paint (Angular @defer on idle). -->
@defer (on idle) {
<app-recent-purchase-popup />
@if ((siteConfig$ | async)?.general?.cart_style === 'cart_mini') {
<app-sticky-cart />
}
<app-sticky-compare />
<div class="theme-option">
	@if ((siteConfig$ | async)?.general?.back_to_top_enable) {
	<app-back-to-top />
	}
</div>
<app-event-modal />
<app-newsletter-modal />
}

<!-- The cookie box: drawn by the server (hidden) in every page, so a first-time visitor sees it with the page; the
     page head decides whether it shows before the first paint (decision D1). Its code loads and wakes up once the page
     is idle, or at once when it is tapped first: that first tap is replayed once it is awake (incremental hydration
     with event replay). -->
@defer (on idle; hydrate on idle; hydrate on interaction) {
<app-cookie />
}
