<app-page-wrapper
	[gridClass]="'col-sm-12'"
	[title]="'tr_transfers'"
>
	<p class="small text-muted mb-3">{{ 'tr_transfers_sub' | transloco }}</p>
	<app-table
		[tableConfig]="tableConfig()"
		[searchPlaceholder]="'tr_search'"
		(tableChanged)="onTableChange($event)"
		(rowClicked)="open($event)"
		(action)="onAction($event)"
	>
		<div
			tableFilters
			class="d-flex align-items-center flex-wrap gap-2"
		>
			@for (item of chips; track item) {
			<button
				type="button"
				class="align-items-center btn btn-sm d-flex"
				[class.btn-theme]="chip() === item"
				[class.btn-outline]="chip() !== item"
				[attr.aria-pressed]="chip() === item"
				(click)="setChip(item)"
			>
				{{ 'tr_chip_' + item | transloco }}@if (counts()?.[item] !== undefined) {
				<span class="ms-1">{{ counts()?.[item] }}</span>
				}
			</button>
			}
			<app-period-picker
				[choices]="presets"
				[start]="'this_month'"
				[labelPrefix]="'period_'"
				[hint]="hint"
				(picked)="setPeriod($event)"
			/>
		</div>
	</app-table>
</app-page-wrapper>
