<div class="title-header">
	<div class="d-flex align-items-center">
		<h5>{{ 'bank_details' | transloco }}</h5>
	</div>
</div>
<form
	class="themeform-auth"
	[formGroup]="form"
	(ngSubmit)="submit()"
>
	<div class="row align-items-center mb-3">
		<label
			for="bank_account_no"
			class="form-label col-xxl-2 col-lg-12 col-md-3"
		>
			{{ 'bank_account_no'| transloco}}
		</label>
		<div class="col-xxl-10 col-lg-12 col-md-9">
			<input
				type="text"
				class="form-control"
				id="bank_account_no"
				placeholder="{{ 'enter_bank_account_no' | transloco }}"
				formControlName="bank_account_no"
				numbersOnly
			/>
		</div>
	</div>
	<div class="row align-items-center mb-3">
		<label
			for="bank_name"
			class="form-label col-xxl-2 col-lg-12 col-md-3"
		>
			{{ 'bank_name'| transloco}}
		</label>
		<div class="col-xxl-10 col-lg-12 col-md-9">
			<input
				type="text"
				class="form-control"
				id="bank_name"
				placeholder="{{ 'enter_bank_name' | transloco }}"
				formControlName="bank_name"
			/>
		</div>
	</div>
	<div class="row align-items-center mb-3">
		<label
			for="bank_holder_name"
			class="form-label col-xxl-2 col-lg-12 col-md-3"
		>
			{{ 'holder_name'| transloco}}
		</label>
		<div class="col-xxl-10 col-lg-12 col-md-9">
			<input
				type="text"
				class="form-control"
				id="bank_holder_name"
				placeholder="{{ 'enter_bank_holder_name' | transloco }}"
				formControlName="bank_holder_name"
			/>
		</div>
	</div>
	<div class="row align-items-center mb-3">
		<label
			for="swift"
			class="form-label col-xxl-2 col-lg-12 col-md-3"
		>
			{{ 'swift'| transloco}}
		</label>
		<div class="col-xxl-10 col-lg-12 col-md-9">
			<input
				type="text"
				class="form-control"
				id="swift"
				placeholder="{{ 'enter_swift' | transloco }}"
				formControlName="swift"
			/>
		</div>
	</div>
	<div class="row align-items-center mb-3">
		<label
			for="ifsc"
			class="form-label col-xxl-2 col-lg-12 col-md-3"
		>
			{{ 'ifsc'| transloco}}
		</label>
		<div class="col-xxl-10 col-lg-12 col-md-9">
			<input
				type="text"
				class="form-control"
				id="ifsc"
				placeholder="{{ 'enter_ifsc' | transloco }}"
				formControlName="ifsc"
			/>
		</div>
	</div>
</form>

<div class="title-header border-custom mb-3">
	<div class="d-flex align-items-center">
		<h5>{{ 'paypal_details'| transloco}}</h5>
	</div>
</div>
<form
	class="themeform-auth"
	[formGroup]="form"
	(ngSubmit)="submit()"
>
	<div class="row align-items-center mb-3">
		<label
			for="paypal_email"
			class="form-label col-xxl-2 col-lg-12 col-md-3"
		>
			{{'paypal_email'| transloco}}
		</label>
		<div class="col-xxl-10 col-lg-12 col-md-9">
			<input
				type="email"
				class="form-control"
				id="paypal_email"
				placeholder="{{ 'enter_paypal_email' | transloco }}"
				formControlName="paypal_email"
			/>
		</div>
	</div>
	<div class="text-end">
		<app-button
			[class]="'btn btn-animation theme-bg-color btn-md d-inline-block'"
			[id]="'payout_btn'"
		>
			{{ 'save'| transloco}}
		</app-button>
	</div>
</form>
