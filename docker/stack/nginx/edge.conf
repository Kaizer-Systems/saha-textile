# Edge proxy for the mode-3 stack. Mirrors the staging/prod origin Nginx behind Cloudflare:
# TLS here (mkcert locally, a Cloudflare Origin Certificate in staging/prod), the client IP
# forwarded in CF-Connecting-IP (what the API's CLIENT_IP_HEADER reads behind Cloudflare),
# and security headers set at the edge rather than in each app.

ssl_certificate     /etc/nginx/certs/stack-cert.pem;
ssl_certificate_key /etc/nginx/certs/stack-key.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
client_max_body_size 2m;   # media bytes go straight to Spaces, never through here

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Where the visitor came from, as a host name only (the Release Console's Search engines screen
# counts "page not found" by referrer). The path and query never reach the log: with
# strict-origin-when-cross-origin a link inside the site sends its full address, which can carry
# a sign-in or reset token. Any user:password@ part is dropped too.
map $http_referer $referer_host {
	default "";
	"~*^https?://(?:[^/?#@]*@)?(?<referer_name>[^/?#:]+)" $referer_name;
}

# The build of the shop or admin that sent the request (header x-client-build, the Release Console's
# Client versions screen): a short source-tree hash, with -app from the installed app. Anything
# else is logged as "", so the header can never carry other text into the log.
map $http_x_client_build $client_build {
	default "";
	"~^[a-z0-9]{7,40}(-app)?$" $http_x_client_build;
}

# --- Secrets in addresses stay out of the request log (owner, 2026-11-21) ---------------------
# Keep this block identical in docker/stack/nginx/edge.conf and docker/production/nginx/
# edge.conf.template; apps/api/src/infra/log-masking.ts masks the API's own log the same way, and a
# test there keeps the three in step. A one-time token, code or key keeps its place in the address
# but its value becomes a placeholder named after it (`/en/pay/{{token}}`,
# `?token={{token}}&lang=en`), so the address keeps its shape and nothing logged can be replayed.
# 1. The payment link carries its token as a path segment: /<locale>/pay/<token>,
#    /storefront/pay/<token>, and inside another address's query when the shop looks a path up
#    (/catalog/seo-route?path=/pay/<token>), plain or URL-encoded. Two passes: path and query.
map $request_uri $log_uri_pay {
	default $request_uri;
	"~*^(?<log_p1_head>.*?(?:/|%2F)pay(?:/|%2F))(?!\{\{)[^/?&#%]+(?<log_p1_tail>.*)$" "${log_p1_head}{{token}}${log_p1_tail}";
}
map $log_uri_pay $log_uri_path {
	default $log_uri_pay;
	"~*^(?<log_p2_head>.*?(?:/|%2F)pay(?:/|%2F))(?!\{\{)[^/?&#%]+(?<log_p2_tail>.*)$" "${log_p2_head}{{token}}${log_p2_tail}";
}
# 2. Each secret query value becomes {{its name}}, one per pass; four passes cover any real link.
map $log_uri_path $log_uri_1 {
	default $log_uri_path;
	"~*^(?<log_a_head>[^?]*\?(?:[^#]*&)?)(?<log_a_name>token|code|state|key|secret|signature|sig|password|passwd|pin|otp|access_token|refresh_token|id_token|client_secret|csrf_token|api_key|apikey|auth|authkey|session|payerid)=(?!\{\{)[^&#]*(?<log_a_tail>.*)$" "${log_a_head}${log_a_name}={{${log_a_name}}}${log_a_tail}";
}
map $log_uri_1 $log_uri_2 {
	default $log_uri_1;
	"~*^(?<log_b_head>[^?]*\?(?:[^#]*&)?)(?<log_b_name>token|code|state|key|secret|signature|sig|password|passwd|pin|otp|access_token|refresh_token|id_token|client_secret|csrf_token|api_key|apikey|auth|authkey|session|payerid)=(?!\{\{)[^&#]*(?<log_b_tail>.*)$" "${log_b_head}${log_b_name}={{${log_b_name}}}${log_b_tail}";
}
map $log_uri_2 $log_uri_3 {
	default $log_uri_2;
	"~*^(?<log_c_head>[^?]*\?(?:[^#]*&)?)(?<log_c_name>token|code|state|key|secret|signature|sig|password|passwd|pin|otp|access_token|refresh_token|id_token|client_secret|csrf_token|api_key|apikey|auth|authkey|session|payerid)=(?!\{\{)[^&#]*(?<log_c_tail>.*)$" "${log_c_head}${log_c_name}={{${log_c_name}}}${log_c_tail}";
}
map $log_uri_3 $log_uri_4 {
	default $log_uri_3;
	"~*^(?<log_d_head>[^?]*\?(?:[^#]*&)?)(?<log_d_name>token|code|state|key|secret|signature|sig|password|passwd|pin|otp|access_token|refresh_token|id_token|client_secret|csrf_token|api_key|apikey|auth|authkey|session|payerid)=(?!\{\{)[^&#]*(?<log_d_tail>.*)$" "${log_d_head}${log_d_name}={{${log_d_name}}}${log_d_tail}";
}
# 3. A secret no pass could place (a fifth one, an odd spelling) hides the whole query instead.
map $log_uri_4 $log_uri {
	default $log_uri_4;
	"~*^(?<log_s_path>[^?]*)\?(?:[^#]*&)?(?:token|code|state|key|secret|signature|sig|password|passwd|pin|otp|access_token|refresh_token|id_token|client_secret|csrf_token|api_key|apikey|auth|authkey|session|payerid)=(?!\{\{)" "${log_s_path}?{{query}}";
}
# --- end of the address masking --------------------------------------------------------------

# One JSON line per request, the same fields as production's edge (docker/production/nginx/
# edge.conf.template) so the Release Console can time requests per host and route. Set inside each
# server block below, which replaces the image's default `main` log there; at this level the two
# would both write and every request would be logged twice. The stack has no Cloudflare in front,
# so the address is the direct one and the Cloudflare fields stay empty.
log_format edge escape=json '{"time":"$time_iso8601","kind":"edge","request_id":"$request_id",'
	'"ip":"$remote_addr","method":"$request_method","uri":"$log_uri","status":$status,'
	'"bytes":$body_bytes_sent,"seconds":$request_time,"upstream_seconds":"$upstream_response_time",'
	'"host":"$host","country":"$http_cf_ipcountry","cf_ray":"$http_cf_ray","cache":"$http_cf_cache_status",'
	'"referer_host":"$referer_host","client_build":"$client_build","user_agent":"$http_user_agent"}';

proxy_http_version 1.1;
proxy_set_header Host               $host;
proxy_set_header X-Forwarded-Proto  https;
proxy_set_header X-Forwarded-For    $remote_addr;
proxy_set_header CF-Connecting-IP   $remote_addr;
proxy_set_header Upgrade            $http_upgrade;
proxy_set_header Connection         $connection_upgrade;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    nosniff always;
add_header Referrer-Policy           strict-origin-when-cross-origin always;

server {
	access_log /var/log/nginx/access.log edge;
	listen 443 ssl;
	listen 8443 ssl;
	http2 on;
	server_name local.saha-textile.localhost;

	# Served here, never by the storefront container: its server sends public files at their
	# build-time size, so a longer deployed config.json is cut off, fails to parse, and the
	# browser silently falls back to localhost. Staging and production Nginx must do the same.
	location = /config.json {
		alias /etc/nginx/public/storefront.config.json;
		default_type application/json;
		expires -1;
	}

	location / { proxy_pass http://storefront:4200; }
}

server {
	access_log /var/log/nginx/access.log edge;
	listen 443 ssl;
	listen 8443 ssl;
	http2 on;
	server_name admin-local.saha-textile.localhost;
	add_header X-Frame-Options DENY always;
	location / { proxy_pass http://admin:8080; }
}

server {
	access_log /var/log/nginx/access.log edge;
	listen 443 ssl;
	listen 8443 ssl;
	http2 on;
	server_name api-local.saha-textile.localhost;
	location / { proxy_pass http://api:4000; }
}

# Google's mailbox sign-in returns only to callbacks registered on the OAuth client, and Google
# refuses `.localhost` sub-domains there. The dev client already registers
# https://localhost:4000/admin/mailboxes/oauth/callback, so in Docker mode the edge answers that one
# address and passes it to the API (owner log § admin Inbox upgrade, 2026-11-19). Everything else on
# this port is refused: it is not a second way into the API. The plain dev API also uses port 4000,
# so the two cannot run at the same time.
server {
	access_log /var/log/nginx/access.log edge;
	listen 4000 ssl;
	http2 on;
	server_name localhost;
	location = /admin/mailboxes/oauth/callback { proxy_pass http://api:4000; }
	location / { return 404; }
}

# Anything else: refuse rather than guess.
server {
	access_log /var/log/nginx/access.log edge;
	listen 443 ssl default_server;
	listen 8443 ssl default_server;
	server_name _;
	return 421;
}
