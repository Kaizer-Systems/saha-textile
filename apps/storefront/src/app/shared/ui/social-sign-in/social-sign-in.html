<!--
	The theme's own social-button container, ported with the Fastkart storefront: `.log-in-button
	> ul > li` already lays these out full-width with the right spacing, in both light and dark
	themes.

	Nothing renders at all when neither provider is configured — a half-configured provider must
	never present a button that cannot work.
-->
@if (showGoogle() || showFacebook()) {
<div class="log-in-button">
	<ul>
		@if (showGoogle()) {
		<li>
			<!--
				Google draws its own button into this element via `renderButton()`. It is
				deliberately empty: supplying our own mark or label would breach Google's
				branding requirements and drift out of date the moment they change it.
			-->
			<div
				#googleMount
				class="social-provider-mount"
				aria-live="polite"
			></div>
		</li>
		} @if (showFacebook()) {
		<li>
			<!--
				Meta publishes no drawable button the way Google does — the SDK's own widget is
				XFBML, which needs `xfbml: true` and a second parse pass over the page. So this is
				a button built to Meta's brand guidance instead: their blue, their mark, their
				wording. It is NOT a generic themed button, because a sign-in button that does not
				look like the provider is one people hesitate over.
			-->
			<button
				type="button"
				class="btn social-provider-button social-provider-button--facebook w-100"
				[disabled]="!facebookReady() || busy() !== null"
				(click)="signInWithFacebook()"
			>
				<svg
					class="social-provider-button__mark"
					viewBox="0 0 24 24"
					aria-hidden="true"
					focusable="false"
				>
					<path
						fill="currentColor"
						d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.412c0-3.026 1.792-4.697 4.533-4.697 1.313 0 2.686.236 2.686.236v2.971H15.83c-1.491 0-1.956.93-1.956 1.886v2.265h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073Z"
					/>
				</svg>
				<span>{{ (busy() === 'facebook' ? 'signing_in' : 'continue_with_facebook') | transloco }}</span>
			</button>
		</li>
		}
	</ul>
	@if (status()) {
	<!--
		One quiet line for every degraded case — unconfigured, blocked script, dismissed popup,
		refused token. Password and OTP sign-in are untouched behind it, which is the point.
	-->
	<p
		class="text-content mt-2 mb-0"
		role="status"
		aria-live="polite"
	>
		{{ status()! | transloco }}
	</p>
	}
</div>
}
