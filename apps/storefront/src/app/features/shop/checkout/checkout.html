<app-breadcrumb [breadcrumb]="breadcrumb()" />
<section class="section-b-space">
	<div class="container-fluid-lg">
		<app-no-data
			[class]="'no-data-added'"
			[image]="'assets/svg/empty-items.svg'"
			[text]="'checkout_closed' | transloco"
			[description]="'checkout_closed_detail' | transloco"
		/>
		<div class="d-flex justify-content-center mt-3">
			<a
				class="btn btn-animation proceed-btn fw-bold"
				[routerLink]="['/cart']"
			>
				{{ 'back_to_cart' | transloco }}
			</a>
		</div>
	</div>
</section>
