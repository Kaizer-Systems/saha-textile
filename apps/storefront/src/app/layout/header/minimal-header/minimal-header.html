<header [class.active]="stick && sticky()">
	@if (data()?.header?.page_top_bar_enable) {
	<app-topbar [data]="data()" />
	}
	<div class="top-nav top-header sticky-header">
		<div class="container-fluid-lg">
			<div class="row">
				<div class="col-12">
					<div class="navbar-top">
						<app-navbar-menu-button
							(activeMenu)="toggle($event)"
							[show]="active"
						/>
						<app-logo />
						<div class="header-nav-middle">
							<div class="main-nav navbar navbar-expand-xl navbar-light navbar-sticky">
								<div
									class="offcanvas offcanvas-collapse order-xl-2"
									[class.show]="active"
								>
									<div class="offcanvas-header navbar-shadow">
										<h5>{{ 'menu' | transloco }}</h5>
										<app-button
											[class]="'btn-close lead'"
											[type]="'button'"
											[id]="'close_btn'"
											[ariaLabel]="'close' | transloco"
											[spinner]="false"
											(click)="toggle(false)"
										/>
									</div>
									<div class="offcanvas-body">
										<app-menu />
									</div>
								</div>
								@if (active) {
								<div
									class="offcanvas-backdrop fade"
									[class.show]="active"
									(click)="toggle(false)"
								></div>
								}
							</div>
						</div>

						<div class="rightside-box">
							<ul class="right-side-menu">
								<li class="right-side search-icon search-full-icon">
									<app-search [style]="'berlin'" />
								</li>
								<li class="right-side">
									<app-header-wishlist [style]="'basic'" />
								</li>
								<li class="right-side">
									<div class="onhover-dropdown header-badge">
										<app-header-cart [style]="'basic'" />
									</div>
								</li>
								<li class="right-side onhover-dropdown">
									<app-my-account [style]="'basic'" />
								</li>
							</ul>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!--
		Phone strip (owner brief, approved 2026-11-09): the top bar's message column is hidden
		below 992 px, so phones get the published events' lines here, one line under the header.
		Existing classes only — `header-top` and `header-offer` are the top bar's own. Drawn only
		while an event has a line, and in the server's first paint, so nothing shifts.
	-->
	@if (events.stripItems().length) {
	<div class="header-top d-lg-none">
		<div class="container-fluid-lg">
			<div class="header-offer">
				<app-notice
					[events]="events.stripItems()"
					[tapOpensPopup]="true"
				/>
			</div>
		</div>
	</div>
	}
</header>
