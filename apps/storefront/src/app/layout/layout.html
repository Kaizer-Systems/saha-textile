<!-- Top Progress Loader -->
<ngx-loading-bar
	class="loader-bg"
	[includeSpinner]="true"
	[height]="'3px'"
/>

<!-- Main Loader -->
@if (themeOptionService.preloader()) {
<app-loader />
}

<!-- Layout Partial -->
<app-header [logo]="setLogo().header_logo" />
<router-outlet />
<app-footer [footer]="setLogo().footer" />

<!-- Widgets -->
<app-recent-purchase-popup />
@if ((themeOption$ | async)?.general?.cart_style === 'cart_mini') {
<app-sticky-cart />
}
<app-sticky-compare />
<div class="theme-option">
	<app-theme-customizer />
	@if ((themeOption$ | async)?.general?.back_to_top_enable) {
	<app-back-to-top />
	}
</div>
<app-newsletter-modal />
<app-cookie />
@if (exit) {
<app-exit-modal />
}
