<div class="slider-4-1 ratio_65 no-arrow product-wrapper">
	<owl-carousel-o [options]="bannerSlider">
		@for (bundles of data(); track bundles) {
		<ng-container carouselSlide>
			@if (bundles?.status) {
			<ng-template carouselSlide>
				<div>
					<div class="product-slider wow fadeInUp">
						<app-image-link
							class="b-cl"
							[image]="bundles"
							[bgImage]="false"
						/>
						<div class="product-slider-detail">
							<div>
								<a
									href="javascript:void(0)"
									class="d-block"
								>
									<h3 class="text-title">{{ bundles?.title }}</h3>
								</a>
								<h5>{{ bundles?.sub_title }}</h5>
							</div>
						</div>
					</div>
				</div>
			</ng-template>
			}
		</ng-container>
		}
	</owl-carousel-o>
</div>
