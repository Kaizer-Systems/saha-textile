packages:
  - 'apps/*'
  - 'packages/*'

# Keep local and CI dependency layouts identical. pnpm otherwise enables the
# experimental global virtual store only outside CI and repeatedly treats the
# same installation as stale when switching between those environments.
enableGlobalVirtualStore: false

# Packages with native/postinstall build steps that pnpm is allowed to build.
# (pnpm blocks lifecycle scripts unless explicitly approved here.)
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  argon2: true
  core-js: false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

# Auto-managed by pnpm: packages exempted from the global minimumReleaseAge gate
# so freshly pinned versions can be installed.
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.0'
  - '@turbo/darwin-arm64@2.10.0'
  - '@turbo/linux-64@2.10.0'
  - '@turbo/linux-arm64@2.10.0'
  - '@turbo/windows-64@2.10.0'
  - '@turbo/windows-arm64@2.10.0'
  - turbo@2.10.0
  - '@aws-sdk/checksums@3.1000.29'
  - '@aws-sdk/client-s3@3.1116.0'
  - '@aws-sdk/core@3.977.9'
  - '@aws-sdk/credential-provider-env@3.972.70'
  - '@aws-sdk/credential-provider-http@3.972.72'
  - '@aws-sdk/credential-provider-ini@3.973.15'
  - '@aws-sdk/credential-provider-login@3.972.77'
  - '@aws-sdk/credential-provider-node@3.972.81'
  - '@aws-sdk/credential-provider-process@3.972.70'
  - '@aws-sdk/credential-provider-sso@3.973.14'
  - '@aws-sdk/credential-provider-web-identity@3.972.76'
  - '@aws-sdk/middleware-sdk-s3@3.972.75'
  - '@aws-sdk/nested-clients@3.997.44'
  - '@aws-sdk/s3-request-presigner@3.1116.0'
  - '@aws-sdk/signature-v4-multi-region@3.996.46'
  - '@aws-sdk/token-providers@3.1116.0'
  - '@aws-sdk/types@3.974.5'
  - '@aws-sdk/xml-builder@3.972.40'
