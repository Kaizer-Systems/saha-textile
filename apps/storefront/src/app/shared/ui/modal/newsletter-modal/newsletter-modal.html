<!--
	Newsletter popup in the WordPress layout (owner log § Media → Newsletter popup), built only
	from existing classes: the theme modal (`modal-box`, `modal-image`, `modal-content`,
	`modal-form-box`), Bootstrap utilities (`flex-lg-row-reverse`, `d-none d-lg-block`,
	`rounded-start-pill`, `rounded-end-pill`, `btn-dark`) and the login page's checkbox.
	The portrait image sits on the right and only from 992 px: on phones the popup stays small,
	so it never reads as an intrusive interstitial.
-->
<ng-template
	#newsletterModal
	let-modal
>
	<div class="modal-header p-0">
		<app-button
			[class]="'btn btn-close'"
			[spinner]="false"
			[id]="'newsletter_modal_close_btn'"
			(click)="modal.dismiss('close')"
		>
			<i class="ri-close-line"></i>
		</app-button>
	</div>
	<div class="modal-box flex-lg-row-reverse">
		<div class="modal-image d-none d-lg-block">
			<img
				[src]="image().src"
				[attr.srcset]="image().srcset"
				sizes="400px"
				[attr.width]="image().width"
				[attr.height]="image().height"
				class="img-fluid"
				[alt]="image().alt"
				loading="lazy"
				decoding="async"
			/>
		</div>
		<div class="modal-content content-padding">
			<div>
				<img
					src="assets/images/logo/1.png"
					class="modal-logo"
					alt="Saha Textile"
				/>
				<h2 id="newsletter-modal-title">{{ 'newsletter_popup_title' | transloco }}</h2>
				<p>{{ 'newsletter_popup_body' | transloco }}</p>
				<form
					class="modal-form"
					(submit)="$event.preventDefault(); submit(emailVal.value)"
				>
					<div class="input-group modal-form-box">
						<input
							type="email"
							class="form-control rounded-start-pill"
							[placeholder]="'newsletter_email_placeholder' | transloco"
							[attr.aria-label]="'newsletter_email_placeholder' | transloco"
							autocomplete="email"
							required
							#emailVal
						/>
						<app-button
							[class]="'input-group-text btn btn-dark bg-dark border-0 rounded-end-pill'"
							[id]="'submit_newsletter_btn'"
							[spinner]="false"
							[type]="'submit'"
						>
							{{ 'submit' | transloco }}
						</app-button>
					</div>
				</form>
				@if (notice()) {
				<p
					class="mt-2 mb-0"
					role="status"
				>
					{{ notice() | transloco }}
				</p>
				}
				<div class="form-check remember-box m-0 mt-3 ps-0">
					<input
						class="checkbox_animated check-box"
						type="checkbox"
						id="newsletter_dont_show"
						#dontShow
						(change)="neverAgain.set(dontShow.checked)"
					/>
					<label
						class="form-check-label"
						for="newsletter_dont_show"
					>
						{{ 'newsletter_dont_show_again' | transloco }}
					</label>
				</div>
			</div>
		</div>
	</div>
</ng-template>
