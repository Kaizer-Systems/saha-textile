<form
	class="form-inline search-full"
	[class.open]="navServices.search"
	#dropdownContainer
	(clickOutside)="clickOutside()"
>
	<div
		class="form-group w-100"
		#toggleButton
	>
		<input
			class="demo-input Typeahead-input form-control-plaintext w-100"
			[(ngModel)]="text"
			[ngModelOptions]="{ standalone: true }"
			(keyup)="searchTerm(text)"
			(click)="openDropDown(text)"
			type="text"
			autocomplete="off"
			placeholder="{{ 'search_fastkart' | transloco }} .."
		/>
		<i
			class="ri-close-line close-icon"
			(click)="closeSearch()"
		></i>
	</div>
	<div
		class="onhover-dropdown"
		[class.open]="searchResult"
	>
		<ul>
			@for (menu of menuItems; track menu) {
			<li>
				<a
					class="main-content"
					[routerLink]="menu?.path"
				>
					@if (menu.icon) {
					<i class="{{ menu.icon }}"></i>
					} @if (menu.title) { {{ menu.title.replace(' ', '_') | transloco }} }
				</a>
			</li>
			}
		</ul>
		@if (searchResultEmpty) {
		<div
			class="Typeahead-menu"
			[class.open]="searchResultEmpty"
		>
			<div class="tt-dataset tt-dataset-0">
				<div class="EmptyMessage">{{ 'opps!!_There_are_no_result_found' | transloco }}</div>
			</div>
		</div>
		}
	</div>
</form>
