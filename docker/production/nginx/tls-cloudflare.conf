# Cloudflare Origin Certificate on the way in, Authenticated Origin Pulls on top of it.
ssl_certificate         /etc/nginx/certs/origin.pem;
ssl_certificate_key     /etc/nginx/certs/origin.key;
ssl_protocols           TLSv1.2 TLSv1.3;
ssl_client_certificate  /etc/nginx/certs/cloudflare-client-ca.pem;
ssl_verify_client       optional;
ssl_verify_depth        2;
