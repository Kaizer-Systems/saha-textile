# Not behind Cloudflare (EDGE_TLS=public): browsers connect directly, so nobody is refused for lacking a
# client certificate and the visitor's address is the connection's own. The edge still writes it into
# CF-Connecting-IP and X-Forwarded-For (proxy.conf), so the API reads it the same way.
map $from_inside $origin_refused {
	default 0;
}
map $from_inside $client_ip {
	default $remote_addr;
}
