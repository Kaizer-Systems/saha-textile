packages:
  - 'apps/*'
  - 'packages/*'

# Keep local and CI dependency layouts identical. pnpm otherwise enables the
# experimental global virtual store only outside CI and repeatedly treats the
# same installation as stale when switching between those environments.
enableGlobalVirtualStore: false

# Packages with native/postinstall build steps that pnpm is allowed to build.
# (pnpm blocks lifecycle scripts unless explicitly approved here.)
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  argon2: true
  core-js: false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

# Auto-managed by pnpm: packages exempted from the global minimumReleaseAge gate
# so freshly pinned versions can be installed.
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.0'
  - '@turbo/darwin-arm64@2.10.0'
  - '@turbo/linux-64@2.10.0'
  - '@turbo/linux-arm64@2.10.0'
  - '@turbo/windows-64@2.10.0'
  - '@turbo/windows-arm64@2.10.0'
  - turbo@2.10.0
