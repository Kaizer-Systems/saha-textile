<div class="variation-axis product-package">
	<app-variant-attributes
		[product]="product()!"
		[attributes]="product()?.attributes || []"
		[owlCar]="owlCar()"
		(selectVariation)="onSelect($event)"
	/>

	@if (showTable()) {
	<app-variation-table
		[product]="product()"
		[selected]="selectedVariation"
	/>
	}
</div>
