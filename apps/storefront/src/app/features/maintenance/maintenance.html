<section
	class="coming-soon-section pt-0"
	[style.background-image]="'url(' + (setting$ | async)?.maintenance?.maintenance_image?.original_url + ')'"
>
	<div class="bg-black"></div>
	<div class="container-fluid-lg w-100">
		<div class="row">
			<div class="col-lg-5"></div>
			<div class="col-xxl-5 col-xl-6 col-lg-7">
				<div class="coming-box">
					<div>
						<div class="coming-title">
							<h2>{{ 'we_ll_be_back_soon' | transloco }}</h2>
						</div>
						<p class="coming-text">{{ 'maintenance_message' | transloco }}</p>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
