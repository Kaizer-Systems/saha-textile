@if (consent.boxOpen()) {
<div
	class="cookie-bar-box"
	role="region"
	[attr.aria-label]="'cookies' | transloco"
>
	<div class="cookie-box">
		<div class="cookie-image">
			<img
				src="assets/images/cookie-bar.png"
				class="blur-up lazyloaded"
				alt=""
			/>
			<h2>{{ 'cookies' | transloco }}</h2>
		</div>
		<div class="cookie-contain">
			<h5 class="text-content">
				{{ 'cookie_box_text' | transloco }}
				<a [routerLink]="['/privacy-policy']">{{ 'cookie_read_policy' | transloco }}</a>
			</h5>
		</div>
	</div>

	<div class="button-group">
		<button
			class="btn ok-button"
			id="cookie_necessary_btn"
			type="button"
			(click)="necessaryOnly()"
		>
			{{ 'cookie_necessary_only' | transloco }}
		</button>
		<button
			class="btn ok-button"
			id="cookie_accept_btn"
			type="button"
			(click)="acceptAll()"
		>
			{{ 'cookie_accept_all' | transloco }}
		</button>
		<button
			class="btn cookie-choose-button"
			id="cookie_choose_btn"
			type="button"
			(click)="consent.openSettings()"
		>
			{{ 'cookie_choose' | transloco }}
		</button>
	</div>
</div>
}
<app-cookie-settings />
