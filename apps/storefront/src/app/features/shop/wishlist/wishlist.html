<app-breadcrumb [breadcrumb]="breadcrumb()" />
<section class="wishlist-section section-b-space">
	<div class="container-fluid-lg">
		@if (wishlistService.skeletonLoader) {
		<div class="row g-sm-3 g-2">
			@for (item of skeletonItems; track item) {
			<div class="col-xxl-2 col-lg-3 col-md-4 product-box-contain col-6">
				<app-skeleton-product-box />
			</div>
			}
		</div>
		} @else {
		<div class="row g-sm-3 g-2">
			@for (product of (wishlistItems$ | async)?.data; track product) {
			<div class="col-xxl-2 col-lg-3 col-md-4 product-box-contain col-6">
				<app-product-box
					[product]="product"
					[close]="true"
					[class]="'product-box-3'"
					[style]="'horizontal'"
				/>
			</div>
			}
		</div>
		} @if (!(wishlistItems$ | async)?.data?.length && !wishlistService.skeletonLoader) {
		<app-no-data
			[class]="'no-data-added'"
			[image]="'assets/svg/empty-items.svg'"
			[text]="'no_items_added' | transloco"
			[description]="'empty_wishlist_description' | transloco"
		/>
		}
	</div>
</section>
