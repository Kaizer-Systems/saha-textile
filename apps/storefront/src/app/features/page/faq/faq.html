<app-breadcrumb [breadcrumb]="breadcrumb()" />
<section class="faq-box-contain section-b-space">
	<div class="container">
		@if (loading()) {
		<app-skeleton-page />
		} @else {
		<div class="row">
			<div class="col-xl-5">
				<div class="faq-contain">
					<h1>{{ 'frequently_asked_questions' | transloco }}</h1>
					<p>{{ 'faq_intro' | transloco }}</p>
				</div>
			</div>
			<div class="col-xl-7">
				<app-faq-accordion [items]="items()" />
			</div>
		</div>
		}
	</div>
</section>
