# =============================================================================
#  Mode 3 — the full local stack, shaped like staging and production
# =============================================================================
#  Same images (docker/images/Dockerfile) that are published as private GHCR
#  packages for staging/prod, behind an Nginx edge that terminates HTTPS with the
#  machine-local mkcert certificate and forwards the client IP the way Cloudflare
#  does. Secrets come from gitignored files mounted read-only at runtime, the way a
#  droplet's release folder is, never from an image or an environment variable.
#
#    pnpm stack:certs   issue the stack certificate (mkcert, once)
#    pnpm stack:env     write docker/stack/env/ from the Infisical dev project
#    pnpm stack:up      build + start everything, wait until healthy
#                       (with STACK_API_IMAGE, STACK_STOREFRONT_IMAGE and STACK_ADMIN_IMAGE set to
#                       images pinned by digest, as `pnpm pipeline:local` does, it builds nothing
#                       and runs exactly those)
#    pnpm stack:down    stop (volumes kept)
#
#  Hosts (Chrome and Firefox resolve *.localhost to loopback by themselves;
#  Safari needs the /etc/hosts line printed by `pnpm stack:env`):
#    https://local.saha-textile.localhost        storefront
#    https://admin-local.saha-textile.localhost  admin
#    https://api-local.saha-textile.localhost    API
#  They follow the staging pattern (staging. / admin-staging. / api-staging.).
#
#  Media is NOT local: dev uses the dev Spaces bucket, exactly as modes 1 and 2.
# =============================================================================

name: saha-textile-stack

# Docker keeps at most 100 MB of each container's output on this Mac (5 files of 20 MB), as on
# the servers. Without it, a stack left running for weeks grows Docker Desktop's disk without end.
x-logging: &logging
  logging:
    driver: local

# As on a droplet: the API and worker read their settings from a file mounted read-only, so no value
# shows in `docker inspect`. Every entry point imports dotenv/config, which reads this path.
x-app-env: &app-env
  environment:
    DOTENV_CONFIG_PATH: /run/secrets/api.env
  secrets:
    - source: api_env
      target: api.env

services:
  mongo:
    <<: *logging
    image: mongo:9.0.4
    # Logins required, as on a droplet (docker/production/compose.yaml): a replica-set keyfile,
    # `--auth`, and the administrator from mounted files. mongod refuses a keyfile unless it is mode
    # 400 and owned by its user, which a bind mount cannot promise, so it is copied in first.
    # `pnpm stack:up` then starts the replica set and creates the app login
    # (docker/stack/prepare-database.sh), as deploy.sh does.
    entrypoint:
      - sh
      - -c
      - >-
        install -o mongodb -g mongodb -m 400 /run/secrets/mongo-keyfile /data/configdb/keyfile &&
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --auth
        --keyFile /data/configdb/keyfile --wiredTigerCacheSizeGB 1
    environment:
      # Only read on an empty data folder.
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo-root-username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo-root-password
    secrets:
      - mongo-keyfile
      - mongo-root-username
      - mongo-root-password
      - mongo-app-password
    volumes:
      - saha_textile_stack_mongo_data:/data/db
      - saha_textile_stack_mongo_configdb:/data/configdb
    healthcheck:
      # `ping` answers without a login, before the replica set is started, as on a droplet.
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 15s
    restart: unless-stopped

  redis:
    <<: *logging
    image: redis:8.8.4-alpine
    # BullMQ needs every job kept: never evict, and persist each second. As on a droplet, the
    # password goes through a config file so it never shows on a command line.
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        printf 'requirepass %s\n' "$$(cat /run/secrets/redis-password)" > /tmp/redis.conf &&
        exec redis-server /tmp/redis.conf --appendonly yes --appendfsync everysec
        --maxmemory-policy noeviction
    secrets:
      - redis-password
    volumes:
      - saha_textile_stack_redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/redis-password)" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  meilisearch:
    <<: *logging
    image: getmeili/meilisearch:v1.16.0
    # The master key comes from a mounted config file, as on a droplet.
    environment:
      MEILI_CONFIG_FILE_PATH: /run/secrets/meilisearch.toml
    secrets:
      - meilisearch.toml
    ports:
      - '127.0.0.1:7700:7700'
    volumes:
      - saha_textile_stack_meili_data:/meili_data
    restart: unless-stopped

  # Request tracing on this computer (owner, 2026-11-23, Release Path brief Q7): one VictoriaTraces,
  # 7 days and at most 2 GiB, only with `--profile tracing`. pnpm dev (OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
  # in apps/api/.env.overrides) sends spans to 127.0.0.1:10428; the Release Console reads its
  # Jaeger-style search at /select/jaeger/api. Jaeger alone is the settings-only fallback.
  traces:
    <<: *logging
    image: victoriametrics/victoria-traces:v0.13.0@sha256:3018df8f99429d7d3029167ab9f70848bf0a778c31c49dff16c86c7e34759fbd
    profiles: [tracing]
    command:
      - -storageDataPath=/traces
      - -retentionPeriod=7d
      - -retention.maxDiskSpaceUsageBytes=2GiB
      - -httpListenAddr=:10428
    ports:
      - '127.0.0.1:10428:10428'
    volumes:
      - saha_textile_stack_traces:/traces
    restart: unless-stopped

  api:
    <<: [*logging, *app-env]
    build: { context: ../.., dockerfile: docker/images/Dockerfile, target: api }
    image: ${STACK_API_IMAGE:-saha-textile-api:local}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_started }
    restart: unless-stopped

  worker:
    <<: [*logging, *app-env]
    image: ${STACK_API_IMAGE:-saha-textile-api:local}
    command: ['node', 'dist/worker.js']
    # Encoding is the only CPU-heavy work; keep it niced and bounded like on the droplet.
    cpus: 2
    mem_limit: 1536m
    healthcheck:
      disable: true
    depends_on:
      api: { condition: service_started }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  storefront:
    <<: *logging
    build: { context: ../.., dockerfile: docker/images/Dockerfile, target: storefront }
    image: ${STACK_STOREFRONT_IMAGE:-saha-textile-storefront:local}
    env_file: ./env/storefront.env
    volumes:
      # SSR calls the API through the edge over HTTPS, so it must trust the local CA.
      - ../../certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

  admin:
    <<: *logging
    build: { context: ../.., dockerfile: docker/images/Dockerfile, target: admin }
    image: ${STACK_ADMIN_IMAGE:-saha-textile-admin:local}
    volumes:
      - ./env/admin.config.json:/usr/share/nginx/html/config.json:ro
    restart: unless-stopped

  edge:
    <<: *logging
    image: nginx:1.30.6-alpine
    ports:
      # 443 by default; a machine where 443 is taken sets STACK_HTTPS_PORT=8443 in env/stack.env.
      # The edge listens on both, so in-network SSR calls use the same origin as the browser.
      - '127.0.0.1:${STACK_HTTPS_PORT:-443}:${STACK_HTTPS_PORT:-443}'
      # Google's mailbox callback only (see nginx/edge.conf); this machine only, never the network.
      - '127.0.0.1:4000:4000'
    volumes:
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./env/storefront.config.json:/etc/nginx/public/storefront.config.json:ro
      - ../../certs/stack-cert.pem:/etc/nginx/certs/stack-cert.pem:ro
      - ../../certs/stack-key.pem:/etc/nginx/certs/stack-key.pem:ro
    depends_on: [api, storefront, admin]
    networks:
      default:
        # Containers resolve the public hostnames to the edge, so server-side calls take
        # the same HTTPS path a browser does — as they would through Cloudflare.
        aliases:
          - local.saha-textile.localhost
          - admin-local.saha-textile.localhost
          - api-local.saha-textile.localhost
    restart: unless-stopped

secrets:
  api_env:
    file: ./env/api.env
  mongo-keyfile:
    file: ./env/mongo-keyfile
  mongo-root-username:
    file: ./env/mongo-root-username
  mongo-root-password:
    file: ./env/mongo-root-password
  mongo-app-password:
    file: ./env/mongo-app-password
  redis-password:
    file: ./env/redis-password
  meilisearch.toml:
    file: ./env/meilisearch.toml

volumes:
  saha_textile_stack_mongo_data:
    name: saha_textile_stack_mongo_data
  saha_textile_stack_mongo_configdb:
    name: saha_textile_stack_mongo_configdb
  saha_textile_stack_redis_data:
    name: saha_textile_stack_redis_data
  saha_textile_stack_traces:
    name: saha_textile_stack_traces
  saha_textile_stack_meili_data:
    name: saha_textile_stack_meili_data
