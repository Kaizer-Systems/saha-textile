<!-- Wishlist Basic -->
@if (style() === 'basic') {
<a
	[routerLink]="['/wishlist']"
	class="btn position-relative header-wishlist p-0"
	[attr.aria-label]="'wishlist' | transloco"
>
	<i class="ri-heart-line"></i>
</a>
}

<!-- Wishlist Classic -->
@if (style() === 'classic') {
<a
	[routerLink]="['/wishlist']"
	class="header-icon bag-icon"
>
	@if (wishlist.count()) {
	<small class="badge-number badge-light">{{ wishlist.count() }}</small>
	}
	<i class="ri-heart-line"></i>
</a>
}
