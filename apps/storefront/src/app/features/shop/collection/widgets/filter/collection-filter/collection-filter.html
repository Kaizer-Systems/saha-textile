@if (filters.length) {
<div class="filter-title">
	<h2>{{ 'filters' | transloco }}</h2>
	<a
		href="javascript:void(0)"
		role="button"
		(click)="clear()"
	>
		{{ 'clear_all' | transloco }}
	</a>
</div>
} @if (filters.length) {
<ul>
	@for (filter of filters; track filter) {
	<li>
		<a
			href="javascript:void(0)"
			role="button"
		>
			{{filter | titleCase}}
		</a>
		<i
			class="ri-close-line close-icon"
			(click)="remove(filter)"
		></i>
	</li>
	}
</ul>
}
