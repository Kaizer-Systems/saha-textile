<ng-template
	#answersModal
	let-modal
>
	<div class="modal-header">
		<h3 class="fw-semibold mb-1">{{ 'Answers' | transloco }}</h3>
		<app-button
			[class]="'btn btn-close'"
			[spinner]="false"
			[id]="'payout_close_btn'"
			(click)="modal.dismiss('Cross click')"
		>
			<i class="ri-close-line"></i>
		</app-button>
	</div>
	<div class="modal-body qa-modal">
		<div class="rounded-3 mb-4 border">
			<table class="all-package theme-table no-footer table">
				<tbody>
					<tr>
						<td class="fw-semibold text-start">{{ 'Question' | transloco }}</td>
						<td class="text-start">{{ qna?.question }}</td>
					</tr>
					<tr>
						<td class="fw-semibold text-start">{{ 'Answers' | transloco }}</td>
						<td class="text-start">
							<textarea
								class="form-control"
								placeholder="Enter Answers"
								[formControl]="answers"
							></textarea>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
		<div>
			<div class="button-box">
				<app-button
					[class]="'btn-md fw-bold btn btn-secondary'"
					[id]="'close_answers_modal_btn'"
				>
					{{ 'Close' | transloco }}
				</app-button>
				<app-button
					[class]="'btn-theme btn-md fw-bold btn'"
					[id]="'submit_answers_btn'"
					(click)="submit()"
				>
					{{ 'submit' | transloco }}
				</app-button>
			</div>
		</div>
	</div>
</ng-template>
