# Edge proxy for the mode-3 stack. Mirrors the staging/prod origin Nginx behind Cloudflare:
# TLS here (mkcert locally, a Cloudflare Origin Certificate in staging/prod), the client IP
# forwarded in CF-Connecting-IP (what the API's CLIENT_IP_HEADER reads behind Cloudflare),
# and security headers set at the edge rather than in each app.

ssl_certificate     /etc/nginx/certs/stack-cert.pem;
ssl_certificate_key /etc/nginx/certs/stack-key.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
client_max_body_size 2m;   # media bytes go straight to Spaces, never through here

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

proxy_http_version 1.1;
proxy_set_header Host               $host;
proxy_set_header X-Forwarded-Proto  https;
proxy_set_header X-Forwarded-For    $remote_addr;
proxy_set_header CF-Connecting-IP   $remote_addr;
proxy_set_header Upgrade            $http_upgrade;
proxy_set_header Connection         $connection_upgrade;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    nosniff always;
add_header Referrer-Policy           strict-origin-when-cross-origin always;

server {
	listen 443 ssl;
	http2 on;
	server_name local.saha-textile.localhost;
	location / { proxy_pass http://storefront:4200; }
}

server {
	listen 443 ssl;
	http2 on;
	server_name admin-local.saha-textile.localhost;
	add_header X-Frame-Options DENY always;
	location / { proxy_pass http://admin:8080; }
}

server {
	listen 443 ssl;
	http2 on;
	server_name api-local.saha-textile.localhost;
	location / { proxy_pass http://api:4000; }
}

# Anything else: refuse rather than guess.
server {
	listen 443 ssl default_server;
	server_name _;
	return 421;
}
