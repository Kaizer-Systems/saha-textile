<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Saha Textile Admin</title>
		<!-- The admin is never listed by search engines, in any environment (owner, 2026-11-24). -->
		<meta
			name="robots"
			content="noindex, nofollow"
		/>
		<base href="/" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<link
			rel="icon"
			id="appIcon"
			type="image/x-icon"
			href="/assets/images/favicon.png"
		/>
		<!-- Text fonts come from this address (src/fonts.css, written by scripts/self-host-fonts.mjs). -->
		<link
			rel="preload"
			href="/assets/fonts/text/public-sans-normal-100-900-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="stylesheet"
			href="/src/styles.scss"
		/>
		<!-- Dark mode, when chosen in this browser, before anything is drawn (core/brand/theme-mode.ts). -->
		<script src="/assets/js/theme-mode.js"></script>
	</head>
	<body>
		<app-root></app-root>
		<script
			type="module"
			src="/src/main.ts"
		></script>
	</body>
</html>
