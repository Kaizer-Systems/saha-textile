<span
	class="st-thumbs"
	[class.is-sm]="size() === 'sm'"
	aria-hidden="true"
>
	@for (src of shown(); track $index) {
	<img
		[src]="src"
		alt=""
		width="40"
		height="52"
		loading="lazy"
		decoding="async"
	/>
	} @if (extra() > 0) {
	<span class="st-thumbs-more">+{{ extra() }}</span>
	}
</span>
