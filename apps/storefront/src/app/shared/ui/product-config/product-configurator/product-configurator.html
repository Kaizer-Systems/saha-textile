<!-- filter_only descriptive attributes (display-only); the product page shows them below its buttons -->
@if (hasFilterAttrs() && showFacts()) {
<app-attributes-info [attributes]="product().semantic_attributes || []" />
}

<!-- composed sections: any combination of variation axis + add-on + bundle -->
@if (hasVariation()) {
<app-variation-axis
	[product]="product()"
	[owlCar]="owlCar()"
	[showTable]="showTable()"
	(selectVariation)="selectVariation($event)"
/>
} @if (hasAddon()) {
<app-addon-group
	[product]="product()"
	[basePrice]="effectiveBase()"
	[initialSelections]="addonSeed()"
	[initialMeasurements]="measurementSeed()"
	(stateChange)="onAddonChange($event)"
/>
} @if (hasBundle()) {
<app-bundle-configurator
	[product]="product()"
	[showSummary]="showSetSummary()"
	[initialSelections]="bundleSeed()"
	[initialMeasurements]="measurementSeed()"
	(stateChange)="onBundleChange($event)"
/>
}
