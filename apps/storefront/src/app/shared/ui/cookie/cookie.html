<!-- In every page from the server, hidden; the page head shows it before the first paint to a visitor who has not
     decided (consent-ask.vite.ts), and once this code runs, `boxOpen` decides (decision D1). -->
<div
	class="cookie-bar-box"
	role="region"
	[attr.aria-label]="'cookies' | transloco"
	[hidden]="!consent.boxOpen()"
>
	<div class="cookie-box">
		<div class="cookie-image">
			<img
				src="assets/images/cookie-bar.png"
				class="blur-up lazyloaded"
				alt=""
				loading="lazy"
				decoding="async"
			/>
			<h2>{{ 'cookies' | transloco }}</h2>
		</div>
		<div class="cookie-contain">
			<p class="h5 text-content">
				{{ 'cookie_box_text' | transloco }}
				<a [routerLink]="['/privacy-policy']">{{ 'cookie_read_policy' | transloco }}</a>
			</p>
		</div>
	</div>

	<div
		class="button-group"
		[style.--cookie-label-chars]="longest('cookie_necessary_only' | transloco, 'cookie_accept_all' | transloco, 'cookie_choose' | transloco)"
	>
		<button
			class="btn ok-button"
			id="cookie_necessary_btn"
			type="button"
			(click)="necessaryOnly()"
		>
			{{ 'cookie_necessary_only' | transloco }}
		</button>
		<button
			class="btn ok-button"
			id="cookie_accept_btn"
			type="button"
			(click)="acceptAll()"
		>
			{{ 'cookie_accept_all' | transloco }}
		</button>
		<button
			class="btn cookie-choose-button"
			id="cookie_choose_btn"
			type="button"
			(click)="choose()"
		>
			{{ 'cookie_choose' | transloco }}
		</button>
	</div>
</div>
<app-cookie-settings />
