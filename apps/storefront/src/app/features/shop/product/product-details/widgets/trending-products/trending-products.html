@if (relatedProducts.length) {
<div class="pt-25">
  <div class="category-menu">
    <h3>{{ 'trending_products' | translate }}</h3>
    <ul class="product-list border-0 p-0 sidebar-product d-flex">
      @for (product of relatedProducts | slice:0:4; track product) {
      <li>
        <app-product-box [product]="product" [style]="'vertical'" />
      </li>
      }
    </ul>
  </div>
</div>
}
