@if (purchase(); as purchase) {
<div
	class="media recently-purchase"
	[class.show]="show()"
>
	<img
		[src]="purchase.product.product_thumbnail ?
                purchase.product.product_thumbnail.original_url :
                'assets/images/product.png'"
		class="media-height"
		alt="product"
	/>
	<div class="media-body">
		<div>
			<div class="title d-block mb-0">{{ 'someone_recently_purchased' | transloco }}</div>
			<a [routerLink]="['/product/', purchase.product.slug]">
				<span class="product-name">{{ purchase.product.name }}</span>
			</a>
			<small class="timeAgo">{{ timeAgo() }}</small>
		</div>
	</div>
	<a
		href="javascript:void(0)"
		(click)="closePopup()"
		class="close-popup ri-close-fill"
	></a>
</div>
}
