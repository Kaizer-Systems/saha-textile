<a
	[routerLink]="['/']"
	class="web-logo nav-logo"
	[attr.aria-label]="brand()?.shopName"
>
	@if (brand()?.logo; as logo) {
	<picture>
		@if (brand()?.seal; as seal) {
		<source
			media="(max-width: 767.98px)"
			[attr.srcset]="seal.srcset"
			sizes="50px"
			[attr.width]="seal.width"
			[attr.height]="seal.height"
		/>
		}
		<img
			[src]="logo.url"
			[attr.srcset]="logo.srcset"
			sizes="300px"
			[attr.width]="logo.width"
			[attr.height]="logo.height"
			[alt]="brand()?.shopName"
			fetchpriority="high"
		/>
	</picture>
	} @else {
	<h2 class="f-w-600">{{ brand()?.shopName }}</h2>
	}
</a>
