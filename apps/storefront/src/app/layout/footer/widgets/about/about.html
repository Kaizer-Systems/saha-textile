<div class="footer-logo-contain">
	<p>{{ 'footer_about_text' | transloco }}</p>
	<ul class="address">
		@if (data()?.footer?.about_address) {
		<li>
			<i class="ri-home-line"></i>
			<a
				[href]="'https://www.google.com/maps/search/?api=1&query=' + encodedAddress()"
				target="_blank"
				rel="noopener"
			>
				{{ data()?.footer?.about_address }}
			</a>
		</li>
		} @if (data()?.footer?.about_email) {
		<li>
			<i class="ri-mail-line"></i>
			<a href="mailto:{{ data()?.footer?.about_email }}">{{ data()?.footer?.about_email }}</a>
		</li>
		}
	</ul>
</div>
