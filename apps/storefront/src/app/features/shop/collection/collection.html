<app-breadcrumb [breadcrumb]="breadcrumb()" />
<section>
	<div class="container-fluid-lg">
		<div class="title mt-3">
			<h1>{{ breadcrumb().title }}</h1>
		</div>
		<div class="row">
			<div class="col-12">
				<app-collection-categories
					[style]="'browse'"
					[path]="filter()['path']"
				/>
			</div>
		</div>
	</div>
</section>
<section
	class="section-b-space shop-section"
	id="filtered_products"
>
	<div class="container-fluid-lg">
		<div class="row">
			<div class="col-custome-3">
				<div
					class="left-box"
					[class.show]="attributeService.offCanvasMenu"
				>
					<app-collection-sidebar [filter]="filter()" />
				</div>
			</div>
			<div class="col-custome-9">
				<app-collection-products [filter]="filter()" />
			</div>
		</div>
	</div>
</section>

<!-- Category FAQ (questions for this category and its parents): theme title and the FAQ page's
     accordion, every answer in the page source. Plain first page only. -->
@if (faq().length) {
<section class="section-b-space">
	<div class="container-fluid-lg">
		<div class="faq-box-contain">
			<div class="title">
				<h2>{{ 'frequently_asked_questions' | transloco }}</h2>
			</div>
			<app-faq-accordion [items]="faq()" />
		</div>
	</div>
</section>
}
