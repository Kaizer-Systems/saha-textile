<app-breadcrumb [breadcrumb]="breadcrumb" />
<section class="section-404 section-lg-space">
	<div class="container-fluid-lg">
		<div class="row">
			<div class="col-12">
				<div class="image-404">
					<img
						src="assets/images/inner-page/500.png"
						class="img-fluid"
						alt="error 500"
					/>
				</div>
			</div>
			<div class="col-12">
				<div class="contain-404">
					<h3 class="text-content">{{ 'internal_server_error_message' | transloco }}</h3>
					<app-button
						[class]="'btn btn-md text-white theme-bg-color mt-4 mx-auto'"
						[id]="'back_button'"
						[spinner]="false"
						(click)="back()"
					>
						{{ 'back_to_home' | transloco }}
					</app-button>
				</div>
			</div>
		</div>
	</div>
</section>
