<ul class="category-list custom-padding">
	@for (number of numbers; track number) {
	<li>
		<div class="form-check category-list-box m-0 ps-0">
			<input
				class="checkbox_animated"
				type="checkbox"
				id="rating-{{number}}"
				[value]="number"
				[checked]="checked(number.toString())"
				(change)="applyFilter($event)"
			/>
			<div class="form-check-label">
				<div class="product-rating">
					<ngb-rating [rate]="number" />
				</div>
				<span class="text-content">({{number}} {{ 'star' | transloco }})</span>
			</div>
		</div>
	</li>
	}
</ul>
