<app-page-wrapper
	[gridClass]="'col-sm-12'"
	[title]="'pages'"
>
	@if (missing) {
	<p
		class="help-text"
		id="pages_missing_note"
	>
		{{ 'pages_missing_note' | transloco }}
	</p>
	}
	<app-table
		[tableConfig]="tableConfig()"
		[hasCheckbox]="false"
		(rowClicked)="edit($any($event))"
		(action)="onActionClicked($event)"
	/>
</app-page-wrapper>
