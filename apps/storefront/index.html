<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Saha Textile</title>
		<base href="/" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<meta
			name="theme-color"
			content="#417394"
		/>
		<meta
			name="mobile-web-app-capable"
			content="yes"
		/>
		<meta
			name="apple-mobile-web-app-capable"
			content="yes"
		/>
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="default"
		/>
		<link
			rel="manifest"
			href="/manifest.webmanifest"
		/>
		<link
			rel="icon"
			id="appIcon"
			type="image/x-icon"
			href="/assets/images/favicon.png"
		/>
		<link
			rel="apple-touch-icon"
			href="/assets/images/app-icon-180.png"
		/>
		<!--
			Text fonts come from this address (src/fonts.css, written by scripts/self-host-fonts.mjs).
			The English upright face is preloaded because every page draws text in it first.
		-->
		<link
			rel="preload"
			href="/assets/fonts/text/public-sans-normal-100-900-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<!-- Remix Icon: the font is preloaded so icons do not reflow text when it arrives. -->
		<link
			rel="preload"
			href="/assets/fonts/remixicon/remixicon.woff2?t=1690730386070"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			href="/assets/css/remixicon.css"
			rel="stylesheet"
		/>
		<link
			href="/src/styles.css"
			rel="stylesheet"
		/>
	</head>
	<body>
		<app-root></app-root>
		<script
			type="module"
			src="/src/main.ts"
		></script>
	</body>
</html>
