<!-- Top Progress Loader -->
<ngx-loading-bar
	class="loader-bg"
	[includeSpinner]="true"
	[height]="'3px'"
/>

<!-- Main Loader -->
@if (siteConfigService.preloader()) {
<app-loader />
}

<!-- Layout Partial -->
<app-header />
<router-outlet />
<!-- The footer is drawn by the server and wakes only when it comes near the screen, so its code is not part of
     the first load (incremental hydration). -->
@defer (on viewport; hydrate on viewport) {
<app-footer [footer]="footerData" />
} @placeholder {
<div></div>
}

<!-- Widgets: none of them is on the first screen (popups, sticky bars, back to top, the cookie box overlay), so
     each loads in its own file once the page is idle, after the first paint (Angular @defer on idle). -->
@defer (on idle) {
<app-recent-purchase-popup />
@if ((siteConfig$ | async)?.general?.cart_style === 'cart_mini') {
<app-sticky-cart />
}
<app-sticky-compare />
<div class="theme-option">
	@if ((siteConfig$ | async)?.general?.back_to_top_enable) {
	<app-back-to-top />
	}
</div>
<app-event-modal />
<app-newsletter-modal />
<app-cookie />
}
