<div
	class="header-wrapper m-0"
	[class.skeleton-header]="navServices.sidebarLoading"
>
	<div class="header-logo-wrapper p-0">
		<div
			class="toggle-sidebar"
			checked="checked"
		>
			<i
				(click)="sidebarToggle()"
				class="ri-apps-line status_toggle middle sidebar-toggle"
			></i>
			<a [routerLink]="['/dashboard']">
				@if (brand.data()?.seal; as seal) {
				<img
					[src]="seal.url"
					[attr.srcset]="seal.srcset"
					sizes="40px"
					class="img-fluid"
					width="40"
					height="40"
					[alt]="brand.data()?.shopName"
				/>
				} @else {
				<h2>{{ brand.data()?.shopName }}</h2>
				}
			</a>
		</div>
	</div>
	<app-search />
	<div class="nav-right right-header p-0">
		<div class="header-btns d-none d-lg-flex">
			<a
				[routerLink]="['/product/create']"
				class="btn btn-outline"
				*hasPermission="'product.create'"
			>
				{{ 'add_product' | transloco }}
			</a>
			<a
				[routerLink]="['/order/create']"
				class="btn btn-animation"
				*hasPermission="'order.create'"
			>
				{{ 'add_order' | transloco }}
			</a>
		</div>
		<ul class="nav-menus">
			<li>
				<span
					class="header-search"
					(click)="clickHeaderOnMobile()"
				>
					<i class="ri-search-line"></i>
				</span>
			</li>
			<li>
				<app-languages />
			</li>
			<li>
				<app-notification />
			</li>
			<li>
				<app-mode />
			</li>
			<app-profile />
		</ul>
	</div>
</div>
