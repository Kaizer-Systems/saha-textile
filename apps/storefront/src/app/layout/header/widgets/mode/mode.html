<button
	type="button"
	class="btn p-0"
	[class.text-white]="onTopBar()"
	id="mode_switch_btn"
	[title]="(themeMode.dark() ? 'switch_to_light' : 'switch_to_dark') | transloco"
	[attr.aria-label]="(themeMode.dark() ? 'switch_to_light' : 'switch_to_dark') | transloco"
	(click)="themeMode.toggle()"
>
	<i
		[class]="themeMode.dark() ? 'ri-sun-line' : 'ri-moon-line'"
		aria-hidden="true"
	></i>
</button>
