<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Saha Textile</title>
		<base href="/" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<meta
			name="theme-color"
			content="#417394"
		/>
		<meta
			name="mobile-web-app-capable"
			content="yes"
		/>
		<meta
			name="apple-mobile-web-app-capable"
			content="yes"
		/>
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="default"
		/>
		<link
			rel="manifest"
			href="/manifest.webmanifest"
		/>
		<link
			rel="icon"
			id="appIcon"
			type="image/x-icon"
			href="/assets/images/favicon.png"
		/>
		<link
			rel="apple-touch-icon"
			href="/assets/images/app-icon-180.png"
		/>
		<!--
			Text fonts come from this address (src/fonts.css, written by scripts/self-host-fonts.mjs).
			The English upright face is preloaded because every page draws text in it first.
		-->
		<link
			rel="preload"
			href="/assets/fonts/text/public-sans-normal-100-900-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<!--
			Remix Icon: the icons the shop uses are preloaded so they do not reflow text when they arrive. They are a
			small part of the font (scripts/split-icon-font.mjs); any other icon loads from the full font only if a
			page shows it. remixicon-shop.css is the vendor's remixicon.css with only its @font-face replaced.
		-->
		<link
			rel="preload"
			href="/assets/fonts/remixicon/remixicon-shop.woff?v=9d3612de"
			as="font"
			type="font/woff"
			crossorigin
		/>
		<link
			href="/assets/css/remixicon-shop.css"
			rel="stylesheet"
		/>
		<!--
			The header is drawn once, whole. The page arrives in pieces on a slow line or a busy phone, and the browser
			drew each piece of the header as it came: the centred menu widened item by item and the icons on the right
			pushed in, so the whole header slid sideways while loading. This holds the first paint until the tag right
			after the header (the layout's router-outlet, about 48 KB into the page) has been read; the rest of the page
			still draws as it arrives. Chrome lifts the hold at that element's opening tag, so it must come after the
			header, not be the header. The server writes each page's own address in front of #page-content
			(src/server/expect-link.ts): with <base href="/"> a bare fragment names the home page, and Chrome ignores
			a link to another page. Browsers without rel="expect" ignore it, and a page without the tag stops waiting
			at its end.
		-->
		<link
			rel="expect"
			href="#page-content"
			blocking="render"
		/>
		<link
			href="/src/styles.css"
			rel="stylesheet"
		/>
	</head>
	<body>
		<app-root></app-root>
		<script
			type="module"
			src="/src/main.ts"
		></script>
	</body>
</html>
