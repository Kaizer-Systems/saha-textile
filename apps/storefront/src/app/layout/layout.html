<!-- Top Progress Loader -->
<ngx-loading-bar
	class="loader-bg"
	[includeSpinner]="true"
	[height]="'3px'"
/>

<!-- Main Loader -->
@if (siteConfigService.preloader()) {
<app-loader />
}

<!-- Layout Partial -->
<app-header [logo]="headerLogo" />
<router-outlet />
<app-footer [footer]="footerData" />

<!-- Widgets -->
<app-recent-purchase-popup />
@if ((siteConfig$ | async)?.general?.cart_style === 'cart_mini') {
<app-sticky-cart />
}
<app-sticky-compare />
<div class="theme-option">
	@if ((siteConfig$ | async)?.general?.back_to_top_enable) {
	<app-back-to-top />
	}
</div>
<app-newsletter-modal />
<app-cookie />
@if (exit) {
<app-exit-modal />
}
