<li
	class="cursor-pointer"
	[class.inside-ul]="children().length > 0"
>
	<div>
		<i
			[title]="'show_subcategories' | transloco"
			class="tree-icon file-icon"
			role="presentation"
			(click)="showChildrenNode = !showChildrenNode"
		></i>
		<span
			[class]="node().id === id ? 'active' : ''"
			[class.disabled]="!node().status"
		>
			{{ label() }}
		</span>
		<div class="tree-options">
			<a
				[title]="'edit' | transloco"
				href="javascript:void(0)"
				*hasPermission="'category.edit'"
				[routerLink]="[node().type === 'post' ? '/blog/category/edit' : '/category/edit', node().id]"
			>
				<i class="ri-pencil-line text-success"></i>
			</a>
			<a
				[title]="'delete' | transloco"
				href="javascript:void(0)"
				*hasPermission="'category.destroy'"
				(click)="DeleteModal().openModal('delete', node())"
			>
				<i class="ri-delete-bin-7-line text-danger"></i>
			</a>
		</div>
	</div>
	@if (children().length && showChildrenNode) {
	<ul>
		@for (node of children(); track node.id) {
		<app-tree-node
			[node]="node"
			[displayKey]="displayKey()"
			[recursionKey]="recursionKey()"
			[locale]="locale()"
		/>
		}
	</ul>
	}
</li>

<!-- Delete Modal -->
<app-delete-modal
	#deleteModal
	(deleteItem)="delete(node())"
/>
