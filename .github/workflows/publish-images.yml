name: Publish images

# Images are built once, when code merges into staging. Production never rebuilds: it runs these
# digests, found through the tree tag, because a merge to main gives a new commit with the same tree.
#
# The repository is public, so anyone signed in can read these logs. Print nothing sensitive.
on:
  push:
    branches: [staging]
  # deploy.yml calls it when a commit it deploys has no images yet.
  workflow_call:

concurrency:
  group: publish-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  proof:
    name: Production stack proof
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Prove the production stack on these images
        run: bash scripts/production-proof.sh

  publish:
    name: Publish ${{ matrix.target }}
    needs: proof
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [api, storefront, admin, ops]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read the code fingerprint
        id: tree
        run: echo "hash=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build number
        id: build
        # The build number the shop and admin send as x-client-build (Release Console, Client versions):
        # the first 12 characters of the code fingerprint, as the local pipeline stamps it, so the same
        # code always carries the same number (images are found by that fingerprint).
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: echo "id=${TREE::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/images/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            BUILD_ID=${{ steps.build.outputs.id }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/saha-textile-${{ matrix.target }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/saha-textile-${{ matrix.target }}:tree-${{ steps.tree.outputs.hash }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
