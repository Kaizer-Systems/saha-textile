# Behind Cloudflare (EDGE_TLS=cloudflare): outside callers must present our own Authenticated Origin
# Pulls certificate, so the visitor's address can only have come from Cloudflare's header.
map "$ssl_client_verify:$from_inside" $origin_refused {
	default     1;
	"SUCCESS:0" 0;
	"SUCCESS:1" 0;
	"NONE:1"    0;
}
map $from_inside $client_ip {
	0 $http_cf_connecting_ip;
	1 $remote_addr;
}
