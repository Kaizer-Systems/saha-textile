@if (paginate.pages && paginate.pages.length) {
<ul class="pagination justify-content-center">
	<li
		class="page-item"
		[class.disabled]="paginate.currentPage === 1"
	>
		<a
			class="page-link"
			href="javascript:void(0)"
			tabindex="-1"
			aria-disabled="true"
			(click)="pageSet(paginate.currentPage - 1)"
		>
			<i class="ri-arrow-left-s-line"></i>
		</a>
	</li>
	@for (page of paginate.pages; track page) {
	<li
		class="page-item"
		[class]="{ 'active disabled': paginate.currentPage === page }"
	>
		<a
			class="page-link"
			href="javascript:void(0)"
			(click)="pageSet(page)"
		>
			{{ page }}
		</a>
	</li>
	}
	<li
		class="page-item"
		[class.disabled]="paginate.currentPage === paginate.totalPages"
	>
		<a
			class="page-link"
			href="javascript:void(0)"
			(click)="pageSet(paginate.currentPage + 1)"
		>
			<i class="ri-arrow-right-s-line"></i>
		</a>
	</li>
</ul>
}
