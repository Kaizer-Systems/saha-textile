<div
	#swiperContainer
	class="swiper notification-slider"
>
	<div class="swiper-wrapper">
		<!--
			Published launch and sale events first, each with its countdown, then the site's own
			lines. Event lines are text bindings, never innerHTML: their words come from the admin.
		-->
		@for (event of events(); track event.id) {
		<div class="swiper-slide">
			<div class="d-flex justify-content-xxl-center">
				<div class="timer-notification">
					<h6>
						<a
							class="text-white"
							[routerLink]="event.linkHref ?? '/'"
						>
							<strong class="me-1">{{ event.title }}</strong>
							{{ label(event) | transloco }} {{ countdown(event) }}
						</a>
					</h6>
				</div>
			</div>
		</div>
		}
		<!--
			Tracked by position, not by `item.id`: `site-config.json` lines carry no id, and with
			Swiper's loop re-rendering, `track item.id` raised thousands of NG0955 warnings.
		-->
		@for (item of content(); track $index) {
		<div class="swiper-slide">
			<div class="d-flex justify-content-xxl-center">
				<div class="timer-notification">
					<h6 [innerHTML]="item.content"></h6>
				</div>
			</div>
		</div>
		}
	</div>
</div>
