<!-- Topbar -->
<div
	class="header-top"
	[class.bg-dark]="data()?.header?.page_top_bar_dark"
>
	<div class="container-fluid-lg">
		<div class="row">
			<div class="col-xxl-3 d-xxl-block d-none">
				<div class="top-left-header">
					<a
						class="hide-when-installed text-white"
						href="javascript:void(0)"
						role="button"
						id="get_the_app_top_link"
						(click)="install.open()"
					>
						<i class="ri-download-2-line"></i>
						<span class="text-white">{{ 'get_the_app' | transloco }}</span>
					</a>
				</div>
			</div>
			<div class="col-xxl-6 col-lg-9 d-lg-block d-none pt-1">
				<div class="header-offer">
					<app-notice
						[content]="data()?.header?.top_bar_content"
						[events]="events.stripItems()"
					/>
				</div>
			</div>
			<div class="col-lg-3">
				<ul class="about-list right-nav-about">
					<li class="right-nav-list">
						<div class="dropdown theme-form-select">
							<app-language />
						</div>
					</li>
					<li class="right-nav-list">
						<div class="dropdown theme-form-select select-arrow">
							<app-currency />
						</div>
					</li>
				</ul>
			</div>
		</div>
	</div>
</div>
