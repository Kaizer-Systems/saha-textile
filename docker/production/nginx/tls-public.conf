# An environment not behind Cloudflare (EDGE_TLS=public; Release Path brief M10): a public certificate
# (Let's Encrypt, kept current by bin/renew-certs.sh), and no Cloudflare client certificate to ask for.
ssl_certificate         /etc/nginx/certs/origin.pem;
ssl_certificate_key     /etc/nginx/certs/origin.key;
ssl_protocols           TLSv1.2 TLSv1.3;
