<header class="pb-md-4 pb-0" [class.active]="stick && sticky()">
  @if (data()?.header?.page_top_bar_enable) {
  <app-topbar [data]="data()" />
  }
  <div class="top-nav top-header sticky-header">
    <div class="container-fluid-lg">
      <div class="row">
        <div class="col-12">
          <div class="navbar-top">
            <div class="d-xl-none d-inline">
              <app-navbar-menu-button (activeMenu)="toggle($event)" [show]="active" />
            </div>
            <app-logo [textClass]="'txt-theme f-w-600'" [data]="data()" [logo]="logo()" />
            <div class="middle-box">
              <div class="location-box">
                <app-categories [style]="'input_dropdown'" />
              </div>
              <div class="search-box">
                <app-search />
              </div>
            </div>
            <div class="rightside-box">
              <ul class="right-side-menu">
                <li class="right-side">
                  <app-search-box />
                </li>
                @if (data()?.header?.support_number) {
                <li class="right-side">
                  <app-call [data]="data()" />
                </li>
                }
                <li class="right-side">
                  <app-header-wishlist />
                </li>
                <li class="right-side">
                  <div class="onhover-dropdown header-badge">
                    <app-header-cart />
                  </div>
                </li>
                <li class="right-side onhover-dropdown">
                  <app-my-account />
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="container-fluid-lg">
    <div class="row">
      <div class="col-12">
        <div class="header-nav">
          <div class="header-nav-left">
            <app-header-categories [data]="data()" />
          </div>
          <div class="header-nav-middle">
            <div class="main-nav navbar navbar-expand-xl navbar-light navbar-sticky">
              <div class="offcanvas offcanvas-collapse order-xl-2" [class.show]="active">
                <div class="offcanvas-header navbar-shadow">
                  <h5>{{ 'menu' | translate }}</h5>
                  <app-button
                    [type]="'button'"
                    [class]="'btn-close lead'"
                    [id]="'toggle_menu_btn'"
                    [spinner]="false"
                    (click)="toggle(false)"
                  >
                    <i class="ri-close-fill"></i>
                  </app-button>
                </div>
                <div class="offcanvas-body">
                  <app-menu />
                </div>
              </div>
              @if (active) {
              <div
                class="offcanvas-backdrop fade"
                [class.show]="active"
                (click)="toggle(false)"
              ></div>
              }
            </div>
          </div>
          @if (data()?.header?.today_deals?.length) {
          <div class="header-nav-right">
            <app-deal [data]="data()" />
          </div>
          }
        </div>
      </div>
    </div>
  </div>
</header>
