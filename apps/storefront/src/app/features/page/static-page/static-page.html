<app-breadcrumb [breadcrumb]="breadcrumb()" />
<section class="section-b-space">
	<div class="container-fluid-lg">
		@if (breadcrumb(); as crumb) {
		<div class="title">
			<h1>{{ crumb.title }}</h1>
		</div>
		}
		<div
			class="ckeditor-content"
			[innerHTML]="content()"
		></div>
	</div>
</section>
