<div class="measurements-form">
	<h3 class="h5 measurements-title">
		<i class="ri-ruler-line"></i>
		{{ title() | transloco }}
	</h3>
	<ul class="select-package">
		<li [class.active]="displayUnit() === 'in'">
			<button
				type="button"
				(click)="showUnit('in')"
			>
				in
			</button>
		</li>
		<li [class.active]="displayUnit() === 'cm'">
			<button
				type="button"
				(click)="showUnit('cm')"
			>
				cm
			</button>
		</li>
	</ul>
	<form [formGroup]="form">
		<div class="row g-3">
			@for (field of fields(); track field.code) {
			<div class="col-md-3 col-6">
				<label
					class="form-label"
					[for]="'meas-' + field.code"
				>
					{{ field.label }}
				</label>
				<div class="input-group">
					<input
						type="number"
						inputmode="decimal"
						class="form-control"
						[id]="'meas-' + field.code"
						[value]="boxText(field)"
						[placeholder]="'enter' | transloco"
						[attr.aria-invalid]="outOfRange(field) ? 'true' : null"
						[attr.aria-describedby]="outOfRange(field) ? 'meas-' + field.code + '-range' : null"
						(input)="onInput(field, $any($event.target).value)"
						(blur)="onLeave(field.code)"
					/>
					<span class="input-group-text">{{ displayUnit() }}</span>
				</div>
				@if (outOfRange(field); as limits) {
				<div
					class="invalid-feedback"
					[id]="'meas-' + field.code + '-range'"
				>
					{{ 'measurement_range' | transloco: limits }}
				</div>
				} @else if (keptNote(field); as kept) {
				<p class="text-content">{{ kept }}</p>
				}
			</div>
			}
		</div>
		<p class="measurements-note text-content">{{ 'measurements_note' | transloco }}</p>
	</form>
</div>
