@if (data()?.length) {
<div class="category-list-box">
	<ul>
		@for (category of data(); track category.slug) {
		<li>
			<a
				[routerLink]="['/blogs']"
				[queryParams]="{ category: category.slug }"
			>
				<div class="category-name">
					<h5>{{ category.name }}</h5>
					<span>({{ category.count }})</span>
				</div>
			</a>
		</li>
		}
	</ul>
</div>
}
