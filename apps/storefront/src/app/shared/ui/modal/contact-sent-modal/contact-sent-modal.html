<div class="modal-header">
	<h3
		class="fw-semibold"
		id="contact_sent_title"
	>
		{{ 'contact_sent_title' | transloco }}
	</h3>
	<app-button
		[class]="'btn btn-close'"
		[spinner]="false"
		[id]="'contact_sent_close_btn'"
		(click)="modal.dismiss('Cross click')"
	>
		<i class="ri-close-line"></i>
	</app-button>
</div>
<div>
	<div class="modal-body policy-body">
		<p class="text-content mb-0">{{ 'contact_sent_text' | transloco }}</p>
	</div>
</div>
